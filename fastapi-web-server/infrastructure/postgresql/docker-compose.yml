# Development-only example values. Not for real deployment.

services:
  db:
    image: postgres:14.1-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ~/.docker-conf/postgresql_data:/var/lib/postgresql/data
      - ./db-init-us:/docker-entrypoint-initdb.d
      #extra_hosts:
      #- "host.docker.internal:172.20.128.1"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: 'rabbitmq'
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    environment:
      - "RABBITMQ_DEFAULT_USER=uudex"
      - "RABBITMQ_DEFAULT_PASS=uudex"
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq/
