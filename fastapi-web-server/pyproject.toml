[tool.poetry]
name = "uudex-fastapi-server"
version = "1.1.0"
description = ""
authors = ["C. Allwardt <3979063+craig8@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "uudex_server", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.4"
# uvicorn = {extras = ["standard"], version = "^0.24.0.post1"}
sqlmodel = "^0.0.22"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"
casbin = "^1.33.0"
python-dotenv = "^1.0.0"
benedict = {extras = ["all"], version = "^0.3.2"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
fastui = "^0.4.0"
cryptography = "42.0.4"
attrs = "^23.2.0"
kafka = "^1.3.5"
pyrabbit2 = "^1.0.7"
pyjwt = "^2.8.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
pytz = "^2024.2"
databases = {extras = ["postgresql"], version = "^0.9.0"}


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
pytest = "^8.3.3"
openapi-python-client = "^0.17.2"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.21.0"
mypy = "^1.8.0"
types-pytz = "^2024.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 100
split_before_logical_operator = true

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Within `except` clause, raise exceptions with `raise ... from err`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",      # Unused function args -> fixtures nevertheless are functionally relevant
    "S101",     # Use of assert detected
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
show_error_context = true
pretty = true
show_column_numbers = true
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "casbin.*",
    "pyrabbit2.*",
    "kafka.*",
    "benedict.*",
]
ignore_missing_imports = true
