# Development stack: UUDEX server, PostgreSQL and the verifying proxy. Example values are not for real deployment.
# Start and stop commands: see README, "Compose".
name: uudex

services:
  db:
    image: postgres:18.1-alpine3.22@sha256:270579ee277a572fa8cfdbaec0e1ff588bb7247da92d25165c7237c483e565d9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.compose}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.compose}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # PostgreSQL 18 keeps its data under /var/lib/postgresql/<major>, so mount the parent.
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - db
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    init: true
    # The entrypoint chowns the data directory and drops from root to postgres; on a reused
    # volume it also needs DAC_OVERRIDE, and tini needs KILL to pass the stop signal on.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  server:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No ports: published ports would let anyone forge the client-certificate header.
    # The verifying proxy joins the "app" network to reach this service.
    environment:
      # Only the proxy's fixed address may supply the client-certificate header.
      TRUSTED_PROXY_HOSTS: '["172.29.77.20"]'
    secrets:
      - postgres_dsn
      - messagebus_connection
      - x_ssl_cert
    # --no-proxy-headers: uvicorn must not let X-Forwarded-For replace the TCP peer the gate checks.
    # Bind to the app address only: the server also sits on the db network, and PostgreSQL
    # (or anything else there) must not reach the port that trusts the client-cert header.
    command: ["uvicorn", "uudex_server.main:app", "--host", "172.29.77.10", "--port", "8000", "--no-proxy-headers"]
    networks:
      app:
        ipv4_address: 172.29.77.10
      db:
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://172.29.77.10:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The only way in: verifies client certificates, then forwards the verified one to the server.
  proxy:
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    # The uid and gid that own the key on the host: a bind-mounted key keeps its owner and
    # mode (0600), and root without capabilities cannot read it.
    user: "${UUDEX_PROXY_UID:?set in .env.compose}:${UUDEX_PROXY_GID:?set in .env.compose}"
    # Loopback by default. Set UUDEX_PROXY_BIND to widen it (see README).
    ports:
      - "${UUDEX_PROXY_BIND:-127.0.0.1}:8443:8443"
    # Three single files, read-only. Never the folder, never ca.key, never the Docker socket.
    # create_host_path is off so a wrong UUDEX_CERTS_DIR fails instead of creating a folder.
    volumes:
      - type: bind
        source: ${UUDEX_CERTS_DIR:?set in .env.compose}/ca.crt
        target: /certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UUDEX_CERTS_DIR:?set in .env.compose}/localhost.crt
        target: /certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UUDEX_CERTS_DIR:?set in .env.compose}/localhost.key
        target: /certs/server.key
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: traefik_static
        target: /etc/traefik/traefik.yml
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    networks:
      # "edge" is not internal, which is what lets Docker publish the port.
      edge:
      app:
        ipv4_address: 172.29.77.20
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 200
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # "app" and "db" are internal: no outside access. Only the proxy is published, through "edge".
  app:
    internal: true
    # Fixed so the server can bind to its app address. Addresses .10 (server) and .20 (proxy)
    # are outside ip_range, so Docker hands neither to another container; whoever controls
    # Docker can still start one with --ip 172.29.77.20.
    # To change the subnet, change every place that holds it (see README, "Compose").
    ipam:
      config:
        - subnet: 172.29.77.0/24
          ip_range: 172.29.77.128/25
  db:
    internal: true
  edge:

volumes:
  db_data:

# Proxy configuration, not secret. Mounted read-only at the targets above.
configs:
  traefik_static:
    file: ./traefik/traefik.yml
  traefik_dynamic:
    file: ./traefik/dynamic.yml

# File secrets are bind mounts, so uid/gid/mode here would be ignored. The host files must
# be readable by uid 10001 (the server) and root (PostgreSQL); see README.
secrets:
  postgres_password:
    file: ./secrets/compose_postgres_password
  postgres_dsn:
    file: ./secrets/compose_postgres_dsn
  messagebus_connection:
    file: ./secrets/compose_messagebus_connection
  x_ssl_cert:
    file: ./secrets/compose_x_ssl_cert
